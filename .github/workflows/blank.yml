name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout le dépôt
      uses: actions/checkout@v4

    - name: Installation de Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurer le SDK Android
      uses: android-actions/setup-android@v3

    - name: Nettoyer le projet Gradle
      run: ./gradlew clean --no-daemon

    - name: Créer l'APK TSENA MALAGASY
      # L'option --no-configuration-cache permet d'éviter l'erreur sur le fichier JAR bcprov
      run: ./gradlew assembleDebug --no-daemon --no-configuration-cache
