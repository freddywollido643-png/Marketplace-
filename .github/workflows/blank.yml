name: TSENA MALAGASY V1.0 - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build TSENA MALAGASY APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Firebase environment variables
      - name: Create Firebase environment file
        run: |
          cat > .env.production <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      # 5. TypeScript check
      - name: TypeScript check
        run: npm run typecheck

      # 6. Build React/Vite
      - name: Build web application
        run: npm run build

      # 7. Install Capacitor CLI
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 8. Initialize Android project if necessary
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 9. Sync web application with Android
      - name: Capacitor sync
        run: npx cap sync android

      # 10. Add Android Internet permission
      - name: Enable Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in content:
              content = content.replace(
                  '<manifest ',
                  '<manifest ',
                  1
              )

              marker = '>'
              index = content.find(marker)

              if index == -1:
                  raise SystemExit("Invalid AndroidManifest.xml")

              content = (
                  content[:index + 1]
                  + "\n    "
                  + permission
                  + content[index + 1:]
              )

          manifest.write_text(content)
          PY

      # 11. Verify Internet permission
      - name: Verify Internet permission
        run: |
          grep -q 'android.permission.INTERNET' \
          android/app/src/main/AndroidManifest.xml

          echo "Internet permission enabled successfully."

      # 12. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 13. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 14. Make Gradle executable
      - name: Grant Gradle permission
        run: |
          chmod +x android/gradlew

      # 15. Build debug APK
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      # 16. Find generated APK
      - name: Find APK
        run: |
          find android/app/build/outputs/apk -type f -name "*.apk"

      # 17. Upload APK artifact
      - name: Upload TSENA MALAGASY APK
        uses: actions/upload-artifact@v4
        with:
          name: TSENA-MALAGASY-V1.0-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
