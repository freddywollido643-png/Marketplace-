name: Android APK Build

on:
  push:
    branches: [ "principal" ] # Adapté à votre branche principale visible sur l'image
  pull_request:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout le dépôt
      uses: actions/checkout@v4

    - name: Installation de Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurer le SDK Android
      uses: android-actions/setup-android@v3

    - name: Nettoyer le projet Gradle
      run: gradle clean --no-daemon

    - name: Créer l'APK TSENA MALAGASY
      # Utilisation directe de gradle et désactivation du cache problématique
      run: gradle assembleDebug --no-daemon --no-configuration-cache
