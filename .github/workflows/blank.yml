name: TSENA MALAGASY V1.0 - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Check Android project
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo "===== APP ====="
          ls -la app
          echo "===== GRADLE ====="
          ls -la gradle

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

      - name: Configure Internet permission
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              pos = content.find(">")

              if pos == -1:
                  raise SystemExit("Invalid AndroidManifest.xml")

              content = (
                  content[:pos + 1]
                  + "\n    "
                  + permission
                  + content[pos + 1:]
              )

              manifest.write_text(content)

          print("Internet permission configured.")
          PY

      - name: Verify Internet permission
        run: |
          grep -q "android.permission.INTERNET" \
          app/src/main/AndroidManifest.xml

          echo "Internet permission: OK"

      - name: Check Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "===== GENERATED APK ====="
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSENA-MALAGASY-V1.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
