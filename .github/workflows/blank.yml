name: TSENA MALAGASY V1.0 - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TSENA MALAGASY APK
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Setup Java
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================
      # 3. Setup Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================
      # 4. Check Android project
      # =========================
      - name: Check Android project
        run: |
          echo "Checking Android project..."
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

      # =========================
      # 5. Grant Gradle permission
      # =========================
      - name: Make Gradle executable
        run: chmod +x gradlew

      # =========================
      # 6. Add Internet permission
      # =========================
      - name: Configure Internet permission
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then

            python3 <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          position = content.find(">")

          if position == -1:
              raise SystemExit("Invalid AndroidManifest.xml")

          content = (
              content[:position + 1]
              + "\n"
              + permission
              + content[position + 1:]
          )

          manifest.write_text(content)

          print("Internet permission added.")
          PY

          else
            echo "Internet permission already exists."
          fi

      # =========================
      # 7. Verify Internet
      # =========================
      - name: Verify Internet permission
        run: |
          grep -q "android.permission.INTERNET" \
          app/src/main/AndroidManifest.xml

          echo "Internet permission: OK"

      # =========================
      # 8. Build Debug APK
      # =========================
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      # =========================
      # 9. Find APK
      # =========================
      - name: Find APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # =========================
      # 10. Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSENA-MALAGASY-V1.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
